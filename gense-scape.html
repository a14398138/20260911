<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>原風景 — 夕暮れの野原</title>
<style>
  html,body{margin:0;padding:0;background:#1a1512;height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
const W = 1920, H = 1080;
const cv = document.getElementById("c");
const g = cv.getContext("2d");

/* ---------- 画材:乱数・ノイズ・パレット ---------- */
let seed = 20240712;
function rnd(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function rr(a,b){ return a + (b-a)*rnd(); }
function ri(a,b){ return Math.floor(rr(a,b+1)); }

function hash(x,y,s){ let h = x*374761393 + y*668265263 + s*1442695040888963407;
  h = (h ^ (h>>13)) * 1274126177; return ((h ^ (h>>16)) >>> 0) / 4294967296; }
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s), b=hash(xi+1,yi,s), c=hash(xi,yi+1,s), d=hash(xi+1,yi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,s,oct){
  let v=0, amp=0.5, f=1;
  for(let i=0;i<oct;i++){ v += amp*vnoise(x*f,y*f,s+i*17); amp*=0.5; f*=2; }
  return v;
}

/* 絵の具パレット:燃える夕暮れと麦色の野原 */
const PAL = {
  skyTop:   ["#2b3a5c","#31456b","#3a4f74"],
  skyMid:   ["#7a6a8e","#97748e","#b07f88"],
  sunBand:  ["#e8a35c","#f0b46a","#f7c67e"],
  horizon:  ["#f3d9a4","#f0cf92","#edc483"],
  cloudLit: ["#ffd9a0","#ffcf95","#f7c488"],
  cloudShd: ["#8d7290","#a08098","#7a6488"],
  farMount: ["#6b6a8c","#7a7594","#5f6184"],
  midMount: ["#565276","#615a80","#4c4a6e"],
  hillFar:  ["#8f9a5e","#9aa468","#83915a"],
  hillMid:  ["#a8a855","#b5b060","#9aa050"],
  field:    ["#c9a83f","#d4b34a","#bfa038","#d8bc58"],
  fieldShd: ["#a8862e","#b89a3a","#9c7d2c"],
  tree:     ["#3d3a2e","#4a4534","#333122"],
  grass:    ["#8a7a2f","#a08c38","#756a28","#b09740"],
  ink:      "#2a2118"
};

function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, gg=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); gg=Math.max(0,Math.min(255,gg)); b=Math.max(0,Math.min(255,b));
  return `rgb(${r},${gg},${b})`;
}
function rgba(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
}

/* ---------- 筆:柔らかい楕円の描法 ---------- */
function brush(x,y,rx,ry,rot,color,alpha){
  g.save();
  g.translate(x,y); g.rotate(rot);
  g.globalAlpha = alpha;
  g.fillStyle = color;
  g.beginPath();
  g.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  g.fill();
  g.restore();
}

/* 手ブレ:座標に微かな揺らぎを与える */
function wob(v,scale){ return v + (fbm(v*0.02, v*0.013, 99, 3)-0.5)*scale; }

/* ---------- 1. 下地:空全体 ---------- */
function paintSky(){
  const bands = 160;
  for(let i=0;i<=bands;i++){
    const t = i/bands;
    const y = t*t*H*0.78; // 地平線は画面の約78%付近
    let col;
    if(t < 0.28){ const u=t/0.28;
      const c1=PAL.skyTop[0], c2=PAL.skyMid[0];
      col = mix(c1,c2,u*u);
    } else if(t < 0.62){ const u=(t-0.28)/0.34;
      col = mix(PAL.skyMid[1], PAL.sunBand[1], u);
    } else { const u=(t-0.62)/0.38;
      col = mix(PAL.sunBand[2], PAL.horizon[0], Math.pow(u,0.8));
    }
    // 空気の揺らぎ:バンドごとに色をわずかに混ぜる(滑らかに重ねる)
    const n = fbm(t*4, 7.3, 40, 4);
    col = shade(colHex(col), Math.floor((n-0.5)*10));
    g.fillStyle = col;
    g.fillRect(0, y-6, W, 13);
  }
  // 太陽のにじみ:滑らかな放射グラデーションで(縞を防ぐ)
  const sunX = W*0.68, sunY = H*0.615;
  const glow = g.createRadialGradient(sunX, sunY, 10, sunX, sunY, 340);
  glow.addColorStop(0, "rgba(255,226,158,0.55)");
  glow.addColorStop(0.35, "rgba(255,216,140,0.22)");
  glow.addColorStop(1, "rgba(255,210,140,0)");
  g.fillStyle = glow;
  g.fillRect(sunX-360, sunY-360, 720, 720);
  brush(sunX, sunY, 46, 40, 0, "#fff3d0", 0.9);
  brush(sunX, sunY, 30, 26, 0, "#fffaea", 0.95);
}
function colHex(c){
  if(c[0]==="#") return c;
  const m = c.match(/\d+/g);
  return "#"+m.map(v=>(+v).toString(16).padStart(2,"0")).join("");
}
function mix(h1,h2,t){
  const a=parseInt(h1.slice(1),16), b=parseInt(h2.slice(1),16);
  const r=Math.round((a>>16)*(1-t)+(b>>16)*t);
  const gg=Math.round(((a>>8)&255)*(1-t)+((b>>8)&255)*t);
  const bb=Math.round((a&255)*(1-t)+(b&255)*t);
  return `rgb(${r},${gg},${bb})`;
}

/* ---------- 2. 雲:何層もの筆致で ---------- */
function paintClouds(){
  // 遠い薄い雲
  cloudLayer(H*0.10, 0.55, 0.05, 8, PAL.cloudShd, 0.10);
  // 中景の帯雲(夕焼けに照らされる)
  cloudLayer(H*0.24, 0.9, 0.09, 10, PAL.cloudShd, 0.16);
  // 大きな積雲(上部が陰、下縁が金色に燃える)
  bigCumulus(W*0.20, H*0.16, 340, 90);
  bigCumulus(W*0.58, H*0.10, 430, 110);
  bigCumulus(W*0.86, H*0.20, 280, 70);
  bigCumulus(W*0.40, H*0.33, 520, 60); // 地平線に横たわる雲
  // 太陽の前の薄雲が光を透かす
  for(let i=0;i<260;i++){
    const x = rr(W*0.5, W*0.85), y = rr(H*0.5, H*0.66);
    brush(x, y, rr(20,70), rr(3,9), rr(-0.1,0.1), rgba("#ffcf8e", 0.05));
  }
}
function cloudLayer(baseY, spread, size, count, pal, alpha){
  for(let i=0;i<count;i++){
    const cx = rr(-100, W+100);
    const cy = baseY + rr(-spread, spread)*H*0.1;
    const w = rr(180,480)*size/0.09, h = w*rr(0.12,0.22);
    for(let j=0;j<70;j++){
      const t = j/70;
      const x = cx + (t-0.5)*w + rr(-20,20);
      const y = cy + Math.sin(t*Math.PI)*(-h*0.4) + rr(-4,4);
      const fade = Math.sin(t*Math.PI);
      brush(x, y, w*0.09, h*0.5*fade+2, rr(-0.05,0.05),
        shade(pick(pal), ri(-14,14)), alpha*fade);
    }
  }
}
function bigCumulus(cx, cy, w, h){
  // 陰影の塊
  for(let i=0;i<160;i++){
    const t = rnd();
    const x = cx + (t-0.5)*w + rr(-30,30);
    const y = cy + Math.pow(rnd(),1.6)*h - h*0.3;
    const r = rr(8,26);
    brush(x, y, r, r*0.62, rr(0,6.28), pick(PAL.cloudShd), 0.10);
  }
  // 塊の輪郭をぼかしつつ整える
  for(let i=0;i<5;i++){
    const t = i/5;
    brush(cx + (t-0.5)*w, cy - h*0.22 + Math.sin(t*3)*h*0.1,
      w*0.11, h*0.30, 0, "#00000000".slice(0,7) && shade(pick(PAL.cloudShd), 10), 0.05);
  }
  // 下縁:夕陽を反射する金色
  for(let i=0;i<130;i++){
    const t = rnd();
    const x = cx + (t-0.5)*w*0.92;
    const y = cy + h*0.24 + rr(-6,10);
    brush(x, y, rr(10,30), rr(3,7), rr(-0.08,0.08), pick(PAL.cloudLit), 0.16);
  }
  // 頂上のハイライト
  for(let i=0;i<60;i++){
    const x = cx + rr(-w*0.3, w*0.3);
    const y = cy - h*0.30 + rr(-8,8);
    brush(x, y, rr(6,16), rr(3,7), 0, "#f7dcae", 0.12);
  }
}

/* ---------- 3. 山並み:空気遠近法 ---------- */
function paintMountains(){
  ridge(H*0.72, 70, 0.0035, PAL.farMount, 0.85, 5);
  ridge(H*0.745, 48, 0.005, PAL.midMount, 0.95, 8);
  // 山肌の明暗(尾根に沿う光と影)
  for(let x=0;x<W;x+=3){
    const m = fbm(x*0.004, 3.7, 12, 4);
    const base = H*0.745 + (m-0.5)*96;
    for(let k=0;k<3;k++){
      brush(x + rr(-2,2), base + rr(2,30), rr(2,7), rr(4,14), 0,
        shade(pick(PAL.midMount), ri(-24,-6)), 0.25);
      if(hash(x,7,3) > 0.55)
        brush(x, base + rr(2,20), rr(1,4), rr(2,8), 0, shade("#8a86a8", 20), 0.3);
    }
  }
}
function ridge(baseY, amp, freq, pal, alpha, s){
  g.beginPath();
  g.moveTo(0, H);
  for(let x=0;x<=W;x+=6){
    const y = baseY - fbm(x*freq, 1.2, s, 5)*amp;
    g.lineTo(wob(x,3), y);
  }
  g.lineTo(W, H); g.closePath();
  g.globalAlpha = alpha;
  g.fillStyle = pick(pal);
  g.fill();
  g.globalAlpha = 1;
  // 霞:山の裾を空色に溶かす
  for(let x=0;x<W;x+=8){
    const y = baseY - fbm(x*freq,1.2,s,5)*amp;
    brush(x, y+rr(8,26), rr(14,30), rr(6,14), 0, rgba(PAL.horizon[0], 0.05));
  }
}

/* ---------- 4. 丘と野原:黄金の階調 ---------- */
function paintHills(){
  // 遠い丘
  ridge(H*0.78, 26, 0.003, PAL.hillFar, 1, 21);
  strokeField(H*0.78, H*0.80, 0.55, PAL.hillFar, 0.5);
  // 中景の丘
  ridge(H*0.815, 34, 0.004, PAL.hillMid, 1, 33);
  strokeField(H*0.815, H*0.845, 0.75, PAL.hillMid, 0.8);
  // 手前の大地(地平線から下を埋め尽くす)
  ridge(H*0.85, 30, 0.003, PAL.field, 1, 55);
  strokeField(H*0.85, H, 1, PAL.field, 1);
}
/* 野原を無数の筆跡で埋める:畝と風の流れ */
function strokeField(yTop, yBot, dens, pal, alpha){
  const rows = 130;
  for(let r=0;r<rows;r++){
    const t = r/rows;
    const y = yTop + (yBot-yTop)*Math.pow(t, 1.15) + rr(-2,2);
    const persp = 0.25 + t*1.3; // 近いほど長く太い筆
    const len = rr(30,90)*persp;
    const step = Math.max(4, 26*persp/dens);
    for(let x=rr(-40,0); x<W+60; x+=step){
      const yy = y + (fbm(x*0.01, y*0.02, 77, 3)-0.5)*18*t;
      const rot = (fbm(x*0.006, y*0.01, 88, 3)-0.5)*0.5 + 0.06; // 風で右へ流れる
      const lit = hash(x|0, r, 5);
      let col;
      if(lit > 0.82) col = shade(pick(PAL.field), ri(14,34));   // 陽の当たる穂
      else if(lit < 0.2) col = pick(PAL.fieldShd);               // 影の畝
      else col = shade(pick(pal), ri(-12,12));
      brush(wob(x,4), wob(yy,3), len*0.5, Math.max(1.2, 2.6*persp), rot, col, alpha*rr(0.35,0.75));
    }
  }
}

/* ---------- 5. 麦畑の波と畑の縞 ---------- */
function paintFieldDetail(){
  // 畦道が丘を蛇行して走る
  const pathPts = [];
  for(let i=0;i<=60;i++){
    const t = i/60;
    const y = H*0.83 + t*t*H*0.17;
    const x = W*0.30 + Math.sin(t*5.2 + 1.2)*W*0.16*t + t*W*0.10;
    pathPts.push([x,y]);
  }
  for(let i=1;i<pathPts.length;i++){
    const [x1,y1]=pathPts[i-1], [x2,y2]=pathPts[i];
    const t = i/60;
    const wd = 3 + t*16;
    g.strokeStyle = shade("#d8bd8f", ri(-10,10));
    g.globalAlpha = 0.85; g.lineWidth = wd; g.lineCap="round";
    g.beginPath(); g.moveTo(wob(x1,3),wob(y1,2)); g.lineTo(wob(x2,3),wob(y2,2)); g.stroke();
    g.globalAlpha = 0.4; g.strokeStyle = "#8a744d"; g.lineWidth = wd*0.3;
    g.beginPath(); g.moveTo(wob(x1,3),y1+wd*0.35); g.lineTo(wob(x2,3),y2+wd*0.35); g.stroke();
    g.globalAlpha = 1;
  }
  // 畑の縞模様(遠景の農地パッチ)
  for(let i=0;i<26;i++){
    const x = rr(0,W), y = rr(H*0.79, H*0.86);
    const w = rr(60,220), h = rr(6,18);
    const rot = rr(-0.06,0.06);
    for(let k=0;k<5;k++)
      brush(x+rr(-6,6), y+rr(-3,3), w*0.5, h*0.5, rot,
        shade(pick(PAL.field), ri(-30,30)), 0.22);
  }
  // 風:麦の穂波(斜めの光の帯)
  for(let i=0;i<7;i++){
    const bx = rr(0,W), by = rr(H*0.86,H*0.97);
    for(let j=0;j<90;j++){
      const t=j/90;
      brush(bx + t*rr(300,520), by + t*rr(30,90) + rr(-8,8),
        rr(14,40), rr(1.5,3.5), 0.18, shade("#e8cd7a", ri(-8,18)), 0.10);
    }
  }
}

/* ---------- 6. 主木:夕陽を背にした一本のニセアカシア ---------- */
function paintTree(){
  const tx = W*0.175, groundY = H*0.845;
  // 幹(ねじれのある筆)
  const trunkSegs = [];
  let px = tx, py = groundY;
  for(let i=0;i<24;i++){
    const t = i/24;
    const nx = tx + Math.sin(t*3.4+0.6)*26*(1-t*0.5) + rr(-3,3);
    const ny = groundY - (groundY - groundY+H*0.30)*t - 0;
    trunkSegs.push([nx, ny]);
  }
  for(let i=1;i<trunkSegs.length;i++){
    const [x1,y1]=trunkSegs[i-1],[x2,y2]=trunkSegs[i];
    const t=i/24;
    g.strokeStyle = shade("#4a3d2c", ri(-16,16));
    g.lineWidth = 26*(1-t*0.75);
    g.lineCap="round"; g.globalAlpha=0.95;
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(wob(x2,2),wob(y2,2)); g.stroke();
    g.globalAlpha=1;
  }
  // 枝
  function branch(x,y,ang,len,wd,depth){
    if(depth<=0 || len<6) return;
    const x2 = x + Math.cos(ang)*len, y2 = y + Math.sin(ang)*len;
    g.strokeStyle = shade(pick(PAL.tree), ri(-10,10));
    g.lineWidth = wd; g.lineCap="round"; g.globalAlpha=0.9;
    g.beginPath(); g.moveTo(x,y); g.lineTo(wob(x2,2),wob(y2,2)); g.stroke();
    g.globalAlpha=1;
    const n = ri(2,3);
    for(let i=0;i<n;i++){
      branch(x2, y2, ang + rr(-0.75,0.75), len*rr(0.55,0.78), wd*0.62, depth-1);
    }
  }
  const top = trunkSegs[trunkSegs.length-1];
  branch(top[0], top[1], -Math.PI/2+0.25, 70, 9, 5);
  branch(top[0], top[1], -Math.PI/2-0.35, 62, 8, 5);
  branch(tx+8, groundY-H*0.12, -0.9, 48, 6, 4);
  branch(tx-6, groundY-H*0.20, -2.3, 44, 5, 4);
  // 葉群:数千の点描で塊を築く
  const canopy = [
    [tx+40, groundY-H*0.30, 130, 70],
    [tx-50, groundY-H*0.26, 110, 58],
    [tx+5,  groundY-H*0.40, 120, 60],
    [tx+110,groundY-H*0.24, 80, 44],
    [tx-120,groundY-H*0.20, 70, 40],
  ];
  for(const [cx,cy,cw,ch] of canopy){
    for(let i=0;i<520;i++){
      const a = rnd()*Math.PI*2, d = Math.pow(rnd(),0.6);
      const x = cx + Math.cos(a)*cw*d, y = cy + Math.sin(a)*ch*d;
      let col;
      const sunSide = (x - (W*0.68)) < 0; // 太陽側
      if(!sunSide && rnd()<0.45) col = shade("#5c5a34", ri(0,24));  // 日向
      else col = shade(pick(PAL.tree), ri(-6,10));                  // 日陰
      brush(x, y, rr(2.5,7), rr(1.5,4), rr(0,6.28), col, rr(0.25,0.6));
    }
  }
  // 幹の影が野原に長く伸びる
  for(let i=0;i<70;i++){
    const t=i/70;
    brush(tx + 20 + t*430, groundY + 6 + t*46, rr(8,26)*(1-t*0.4), rr(2,5), 0.12,
      "#6b5a2a", 0.10*(1-t*0.5));
  }
}

/* ---------- 7. 電線と電柱:懐かしの情景 ---------- */
function paintPoles(){
  const poles = [ [W*0.52,H*0.80], [W*0.80,H*0.845], [W*1.02,H*0.88] ];
  for(let i=0;i<poles.length;i++){
    const [px,py]=poles[i];
    const ph = H*0.16, pw = 5;
    g.strokeStyle = shade("#3a332a", ri(-8,8));
    g.lineWidth = pw; g.lineCap="round";
    g.beginPath(); g.moveTo(wob(px,2), py); g.lineTo(wob(px,2), py-ph); g.stroke();
    g.lineWidth = 3.4;
    g.beginPath(); g.moveTo(px-26, py-ph*0.92); g.lineTo(px+26, py-ph*0.92); g.stroke();
    g.beginPath(); g.moveTo(px-20, py-ph*0.74); g.lineTo(px+20, py-ph*0.74); g.stroke();
    // 碍子
    for(let k=-2;k<=2;k+=2){
      brush(px + k*11, py-ph*0.92 - 4, 2.4, 3.4, 0, "#2c261e", 0.8);
      brush(px + k*8, py-ph*0.74 - 3, 2, 3, 0, "#2c261e", 0.8);
    }
    // 小さな変圧器らしき箱
    if(i===1){ brush(px+10, py-ph*0.86, 5, 7, 0, "#33302a", 0.9); }
    // 電線(たわむ曲線)
    if(i < poles.length-1){
      const [qx,qy]=poles[i+1];
      const y1 = py-ph*0.92, y2 = qy-H*0.16*0.92;
      for(let w=0;w<3;w++){
        g.strokeStyle = "#2e2a24"; g.lineWidth = 1.6; g.globalAlpha=0.85;
        g.beginPath(); g.moveTo(px, y1 - w*0);
        const sag = 26 + w*7;
        g.quadraticCurveTo((px+qx)/2, (y1+y2)/2 + sag, qx, y2 - w*0);
        g.stroke(); g.globalAlpha=1;
        const y1b = py-H*0.16*0.74, y2b = qy-H*0.16*0.74;
        if(w<2){
          g.strokeStyle = "#2e2a24"; g.lineWidth = 1.3; g.globalAlpha=0.7;
          g.beginPath(); g.moveTo(px, y1b);
          g.quadraticCurveTo((px+qx)/2, (y1b+y2b)/2 + sag*0.8, qx, y2b);
          g.stroke(); g.globalAlpha=1;
        }
      }
    }
  }
}

/* ---------- 8. 小さな列車:遠くの線路を行く ---------- */
function paintTrain(){
  const ty = H*0.815, tx0 = W*0.60;
  // 緑の堤
  for(let x=W*0.52;x<W*0.98;x+=4){
    brush(x, ty+rr(-2,2), rr(6,12), rr(2,4), rr(-0.02,0.02), shade("#8a8a4a", ri(-14,14)), 0.5);
  }
  // 車体:直線的な矩形で描く古い気動車
  const cars = 4;
  const cw = 66, chh = 11, gap = 8;
  for(let i=0;i<cars;i++){
    const x = tx0 + i*(cw+gap), y = ty - 14;
    g.globalAlpha = 0.95;
    g.fillStyle = shade("#b8452e", ri(-8,8));
    g.fillRect(x, y, cw, chh);
    g.fillStyle = "#d86a3e"; g.fillRect(x, y, cw, 2.5);          // 屋根のライン
    g.fillStyle = "#7a2e1e"; g.fillRect(x, y+chh-2.5, cw, 2.5);  // 裾の影
    for(let w=0;w<5;w++){
      g.fillStyle = "#ffe2a8";
      g.fillRect(x+7+w*11, y+3.5, 6, 4.5);                        // 点灯する窓
    }
    g.fillStyle = "#2c2620";                                      // 車輪
    g.beginPath(); g.arc(x+12, y+chh, 3, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(x+cw-12, y+chh, 3, 0, Math.PI*2); g.fill();
    g.globalAlpha = 1;
  }
  // 先頭車:運転室とヘッドライト
  {
    const hx = tx0 - 6, hy = ty - 14;
    g.globalAlpha = 0.95;
    g.fillStyle = shade("#a83c28", ri(-6,6));
    g.fillRect(hx, hy, 16, chh);
    g.fillStyle = "#ffe9c0"; g.fillRect(hx+2, hy+3, 5, 5);         // 運転席の窓
    g.fillStyle = "#fff8e0";
    g.beginPath(); g.arc(hx-1, hy+chh-4, 2, 0, Math.PI*2); g.fill();
    g.globalAlpha = 1;
  }
  // 線路のキラメキ
  for(let x=W*0.52;x<W*0.98;x+=5){
    brush(x, ty+3, 4, 1.2, 0, "#e8c88a", 0.5);
  }
  // 遠ざかる汽笛の靄
  for(let i=0;i<40;i++){
    brush(tx0+rr(-30,180), ty-rr(8,30), rr(8,26), rr(3,8), 0, rgba("#f0d8a8",0.06));
  }
}

/* ---------- 9. 鳥の群れ ---------- */
function paintBirds(){
  const flocks = [
    {cx:W*0.44, cy:H*0.30, n:9, s:1},
    {cx:W*0.60, cy:H*0.22, n:6, s:0.7},
    {cx:W*0.30, cy:H*0.44, n:4, s:0.55},
  ];
  for(const f of flocks){
    for(let i=0;i<f.n;i++){
      const x = f.cx + rr(-90,90)*f.s*1.4;
      const y = f.cy + rr(-40,40)*f.s;
      const s = rr(4,8)*f.s;
      const flap = Math.sin(rnd()*6.28)*0.5 + 0.5;
      g.strokeStyle = "#2c2418"; g.lineWidth = 1.6*f.s; g.lineCap="round";
      g.globalAlpha = 0.8;
      g.beginPath();
      g.moveTo(x-s, y - flap*s*0.6);
      g.quadraticCurveTo(x-s*0.4, y+1, x, y);
      g.quadraticCurveTo(x+s*0.4, y+1, x+s, y - flap*s*0.6);
      g.stroke();
      g.globalAlpha = 1;
    }
  }
}

/* ---------- 10. 手前の草:枠を飾る無数の穂 ---------- */
function paintForeground(){
  // 下辺の深い草むら
  for(let i=0;i<2600;i++){
    const x = rr(-20, W+20);
    const t = Math.pow(rnd(), 2.2);
    const y = H - t*H*0.10;
    const h = rr(10, 46)*(1-t*0.5);
    const sway = (fbm(x*0.008, 2.2, 66, 3)-0.5)*h*0.5 + h*0.22;
    const col = rnd()<0.7
      ? shade(pick(PAL.grass), ri(-16,16))
      : shade("#c4a444", ri(-10,20)); // 穂先の金
    g.strokeStyle = col; g.lineWidth = rr(0.8,2.2);
    g.globalAlpha = rr(0.5,0.95); g.lineCap = "round";
    g.beginPath();
    g.moveTo(x, y+h);
    g.quadraticCurveTo(x+sway*0.4, y+h*0.5, x+sway, y-h*0.2);
    g.stroke();
    if(rnd()<0.3){ // 穂の実
      brush(x+sway, y-h*0.2, rr(1.5,3.5), rr(1,2.4), sway*0.02, shade("#d8b84f", ri(-10,14)), 0.8);
    }
    g.globalAlpha = 1;
  }
  // 左下に伸びる一房(奥行きの強調)
  for(let i=0;i<180;i++){
    const x = rr(-30, 240), y = H - rr(0, 140);
    const h = rr(30, 90), sway = rr(20, 70);
    g.strokeStyle = shade(pick(PAL.grass), ri(-20,20));
    g.lineWidth = rr(1.5,3); g.globalAlpha = rr(0.4,0.8);
    g.beginPath(); g.moveTo(x,y+h);
    g.quadraticCurveTo(x+sway*0.5, y+h*0.4, x+sway, y-h*0.1);
    g.stroke(); g.globalAlpha=1;
  }
  // 右下のタンポポの残り
  for(let i=0;i<5;i++){
    const x = rr(W*0.75, W*0.98), y = H - rr(20, 90);
    brush(x, y, 4, 4, 0, "#e8c860", 0.9);
    brush(x, y, 2, 2, 0, "#f4e2a0", 0.9);
    g.strokeStyle = "#6a6a2a"; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(x, y+4); g.quadraticCurveTo(x-4, y+18, x-2, y+30); g.stroke();
  }
}

/* ---------- 11. 大気の層:光と霧の画面統一 ---------- */
function paintAtmosphere(){
  // 全体を夕陽の色で薄く染める
  const grd = g.createLinearGradient(0,0,W,H);
  grd.addColorStop(0, "rgba(60,50,90,0.10)");
  grd.addColorStop(0.55, "rgba(240,190,120,0.10)");
  grd.addColorStop(1, "rgba(90,70,40,0.14)");
  g.fillStyle = grd; g.fillRect(0,0,W,H);
  // 地平線の光の帯
  for(let i=0;i<90;i++){
    brush(rr(0,W), H*0.77 + rr(-6,10), rr(60,180), rr(2,6), 0, rgba("#ffe6ae", 0.05));
  }
  // 手前の空気(被写界深度)
  for(let i=0;i<60;i++){
    brush(rr(0,W), H*rr(0.92,1.0), rr(40,120), rr(4,10), 0, rgba("#7a6a30", 0.05));
  }
}

/* ---------- 12. キャンバスの質感:麻布と絵具の粒 ---------- */
function paintGrain(){
  const img = g.getImageData(0,0,W,H);
  const d = img.data;
  for(let i=0;i<d.length;i+=4){
    const x = (i/4)%W, y = Math.floor((i/4)/W);
    const n = fbm(x*0.9, y*0.9, 123, 2);
    const grain = (n-0.5)*22;
    const weave = Math.sin(x*0.9)*Math.sin(y*0.9)*2.2; // キャンバスの織り目
    const v = grain + weave;
    d[i]   = Math.max(0, Math.min(255, d[i]  + v));
    d[i+1] = Math.max(0, Math.min(255, d[i+1]+ v));
    d[i+2] = Math.max(0, Math.min(255, d[i+2]+ v*0.9));
  }
  g.putImageData(img,0,0);
  // 絵具の厚み:ランダムな点々(筆の飛び散り)
  for(let i=0;i<1400;i++){
    const x = rr(0,W), y = rr(0,H);
    const lum = 128;
    brush(x, y, rr(0.5,1.4), rr(0.5,1.4), 0, rnd()<0.5?"rgba(255,240,210,0.05)":"rgba(20,15,10,0.05)");
  }
  // ビネット:周囲をわずかに沈める
  const vg = g.createRadialGradient(W/2,H/2, H*0.45, W/2,H/2, H*0.95);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(30,20,15,0.22)");
  g.fillStyle = vg; g.fillRect(0,0,W,H);
}

/* ---------- 制作開始 ---------- */
g.fillStyle = "#2b3a5c"; g.fillRect(0,0,W,H);
paintSky();
paintClouds();
paintMountains();
paintHills();
paintFieldDetail();
paintTrain();
paintPoles();
paintTree();
paintBirds();
paintForeground();
paintAtmosphere();
paintGrain();

/* 署名:右下に小さく筆で */
g.save();
g.globalAlpha = 0.55;
g.fillStyle = "#3a2e1a";
g.font = "italic 22px Georgia, serif";
g.fillText("夕暮れの野原 — 原風景 v2", W-360, H-30);
g.restore();
</script>
